<nav class="top-nav" aria-label="Primary">
  <button
    class="hamburger"
    [class.hamburger-open]="menuOpen()"
    type="button"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="mobile-nav-overlay"
    (click)="toggleMenu()"
  >
    <span></span><span></span><span></span>
  </button>

  <a
    class="brand"
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    >typefast.</a
  >

  <div class="desktop-links">
    @for (link of links; track link.path) {
      @if (link.children) {
        <div
          class="nav-group"
          [class.nav-group-suppressed]="dropdownSuppressed()"
          (mouseleave)="releaseDropdown()"
          routerLinkActive="active"
        >
          <a
            class="nav-link nav-link-with-children"
            [routerLink]="link.path"
            [attr.aria-haspopup]="'true'"
            (click)="closeDropdown($event)"
          >
            <span class="nav-link-text">{{ link.label }}</span>
            <span class="nav-caret" aria-hidden="true">▾</span>
          </a>
          <div class="nav-dropdown" role="menu">
            @for (child of link.children; track child.path) {
              <a
                role="menuitem"
                class="nav-dropdown-link"
                [routerLink]="child.path"
                routerLinkActive="active"
                (click)="closeDropdown($event)"
                >{{ child.label }}</a
              >
            }
          </div>
        </div>
      } @else {
        <a
          class="nav-link"
          [class.nav-link-cta]="link.cta"
          [routerLink]="link.path"
          routerLinkActive="active"
          >{{ link.label }}</a
        >
      }
    }
  </div>

  <button
    class="nav-settings"
    type="button"
    (click)="settingsClicked.emit()"
    aria-label="Open preferences"
    title="Open preferences"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M24 14v-4c-1.619 0-2.906.267-3.705-1.476-.697-1.663.604-2.596 1.604-3.596l-2.829-2.828c-1.033 1.033-1.908 2.307-3.666 1.575-1.674-.686-1.404-2.334-1.404-3.675h-4c0 1.312.278 2.985-1.404 3.675-1.761.733-2.646-.553-3.667-1.574l-2.829 2.828c1.033 1.033 2.308 1.909 1.575 3.667-.348.849-1.176 1.404-2.094 1.404h-1.581v4c1.471 0 2.973-.281 3.704 1.475.698 1.661-.604 2.596-1.604 3.596l2.829 2.829c1-1 1.943-2.282 3.667-1.575 1.673.687 1.404 2.332 1.404 3.675h4c0-1.244-.276-2.967 1.475-3.704 1.645-.692 2.586.595 3.596 1.604l2.828-2.829c-1-1-2.301-1.933-1.604-3.595l.03-.072c.687-1.673 2.332-1.404 3.675-1.404zm-12 2c-2.209 0-4-1.791-4-4s1.791-4 4-4 4 1.791 4 4-1.791 4-4 4z"
      />
    </svg>
  </button>
</nav>

<div
  id="mobile-nav-overlay"
  class="mobile-nav"
  [class.mobile-nav-show]="menuOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="Site navigation"
>
  <div class="mobile-nav-background" (click)="closeMenu()"></div>
  <div class="mobile-nav-panel">
    <ul class="mobile-nav-list">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [class.mobile-cta]="link.cta"
            (click)="closeMenu()"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>
    <app-footer class="mobile-nav-footer" />
  </div>
</div>
