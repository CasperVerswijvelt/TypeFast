  <body id="body">
    <script>
      // Pre-bootstrap theme application. Prevents flash-of-incorrect-theme by
      // syncing the body class to the saved preference before Angular hydrates.
      // Mirrors PreferencesService defaults (dark, follow_system_theme=false).
      (function () {
        try {
          var raw = localStorage.getItem('preferences');
          var prefs = raw ? JSON.parse(raw) : null;
          var theme = prefs && prefs.theme;
          var follow = prefs && prefs.follow_system_theme;
          if (follow === true) {
            theme =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          } else if (theme !== 'light' && theme !== 'dark') {
            theme = 'dark';
          }
          var body = document.body;
          if (body) {
            body.classList.remove('theme--dark', 'theme--light');
            body.classList.add('theme--' + theme);
          }
        } catch (e) {}
      })();
    </script>

        if ('requestIdleCallback' in window) {
